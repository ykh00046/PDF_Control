[mypy]
python_version = 3.13
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = True

# Strict mode targeted at the operations pipeline, where a type-contract
# mismatch silently broke 3 smoke tests on 2026-04-14. Other app modules
# are checked permissively until their own /pdca cycle.
[mypy-app.operations_service]
strict = True
disallow_any_decorated = False
warn_return_any = False

# Imported legacy modules are not part of the current strict gate. They are
# covered by runtime/regression tests until their own typing cleanup phase.
[mypy-app.config]
ignore_errors = True

[mypy-app.logger]
ignore_errors = True

[mypy-app.model]
ignore_errors = True

[mypy-app.path_helper]
ignore_errors = True

[mypy-app.pdf_engine]
ignore_errors = True
