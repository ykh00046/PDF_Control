# NOTE: keep this file ASCII-only. mypy reads it with the locale default
# encoding (cp949 on Korean Windows), so any non-ASCII byte breaks mypy
# startup with a UnicodeDecodeError (regression: r4-bugfix, 2026-06-10).
[mypy]
python_version = 3.13
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = True

# Strict mode targeted at the operations pipeline, where a type-contract
# mismatch silently broke 3 smoke tests on 2026-04-14. Other app modules
# are checked permissively until their own /pdca cycle.
#
# Scope expanded 2026-05-27 (operations-restructure PDCA) from the single
# operations_service module to the whole app.operations package.
[mypy-app.operations.*]
strict = True
disallow_any_decorated = False
warn_return_any = False

# Backward-compat shim -- re-export only. Strict is enforced on the real
# modules in app.operations, so the shim itself is exempt.
[mypy-app.operations_service]
ignore_errors = True

# Strict gate expanded 2026-06-02 (r2-quality-fixes PDCA) to the clean
# leaf modules below. Each was measured at 0 strict errors (config, logger,
# path_helper, text_utils) or brought to 0 with small type fixes
# (text_metadata, fonts) in the same cycle.
[mypy-app.config]
strict = True

[mypy-app.logger]
strict = True

[mypy-app.path_helper]
strict = True

[mypy-app.text_utils]
strict = True

[mypy-app.text_metadata]
strict = True

[mypy-app.fonts]
strict = True

# Added 2026-06-02 (page-merge-split PDCA): pure, I/O-free split-grouping
# logic, fully annotated. Measured at 0 strict errors.
[mypy-app.page_split]
strict = True

# Added 2026-06-08 (pdf-encryption PDCA): pure, I/O-free encryption policy
# (EncryptionSettings + save-kwargs builder). Measured at 0 strict errors.
[mypy-app.encryption]
strict = True

# Legacy-core strict promotion (2026-06-10, r6-quality): the former
# typing-legacy-core debt. warn_return_any is relaxed because fitz ships no
# stubs (ignore_missing_imports), so fitz.Document/Page returns surface as
# Any -- same policy as the app.operations gate above.
[mypy-app.model]
strict = True

[mypy-app.document_model]
strict = True
warn_return_any = False

[mypy-app.pdf_engine]
strict = True
warn_return_any = False

[mypy-app.document_session]
strict = True
warn_return_any = False
